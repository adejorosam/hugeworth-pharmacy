server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strip the /api prefix before forwarding -- the backend itself has no route prefix
    # (controllers are e.g. @Controller('customers'), not @Controller('api/customers')).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Plain multi-page static site (dashboard.html, pos.html, etc.) -- NOT a SPA, so a real 404 for a
    # missing page is correct; no index.html fallback here (unlike smj-app's React Router frontend).
    location / {
        try_files $uri $uri/ =404;
    }
}
